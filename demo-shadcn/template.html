<style>

/* доска */
.board { display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); grid-template-rows:repeat(8,minmax(0,1fr)); aspect-ratio:1/1; width:100%; max-width:100%; border-radius:calc(var(--radius) - 2px); overflow:hidden; box-shadow:0 1px 3px rgb(0 0 0 / .12), 0 0 0 1px hsl(var(--border)); user-select:none; touch-action:manipulation; }

<script>
const PIECES = __PIECES__;
const ICONS = {
  home: '<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/>',
  play: '<circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4Z"/>',
  puzzle: '<path d="M14 4a2 2 0 1 0-4 0H6v4a2 2 0 1 1 0 4v6h6a2 2 0 1 1 4 0h4v-6a2 2 0 1 0 0-4V4Z"/>',
  road: '<path d="M4 20 8 4M20 20 16 4M12 6v2M12 11v2M12 16v2"/>',
  trophy: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4ZM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18.5 20a6.5 6.5 0 0 0-3-5.5"/>',
  swords: '<path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M9.5 6.5 14 2h3v3l-4.5 4.5M5 14l-2 2 2 2 2-2"/>',
  book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14ZM4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
  palette: '<circle cx="13.5" cy="6.5" r="1"/><circle cx="17.5" cy="10.5" r="1"/><circle cx="8.5" cy="7.5" r="1"/><circle cx="6.5" cy="12.5" r="1"/><path d="M12 2a10 10 0 0 0 0 20 2 2 0 0 0 2-2v-1a2 2 0 0 1 2-2h1a5 5 0 0 0 5-5c0-5.5-4.5-10-10-10Z"/>',
  scale: '<path d="M12 3v18M5 7h14M5 7l-3 7a4 4 0 0 0 6 0L5 7ZM19 7l-3 7a4 4 0 0 0 6 0l-3-7M8 21h8"/>',
  lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
};
const ic = (n, cls = "icon") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

const NAV = [
  { group: "Играть", items: [["home", "home", "Главная"], ["play", "play", "Партия"], ["tourneys", "swords", "Турниры"]] },
  { group: "Учиться", items: [["puzzles", "puzzle", "Задачи"], ["road", "road", "Дорога домой"]] },
  { group: "Школа", items: [["players", "users", "Игроки школы"], ["awards", "trophy", "Награды"]] },
  { group: "Демо", items: [["look", "palette", "Оформление"], ["compare", "scale", "Сравнение с Godot"]] },
];
let route = "home";

function renderNav() {
  document.getElementById("nav").innerHTML = NAV.map(g => `
    <div class="grid gap-0.5">
      <div class="px-2 py-1 text-xs font-medium text-muted-foreground">${g.group}</div>
      ${g.items.map(([id, icon, name]) => `<button class="nav-item" data-nav="${id}" ${id === route ? 'aria-current="page"' : ""}>${ic(icon)}<span>${name}</span>${id === "tourneys" ? '<span class="ml-auto badge badge-solid">2</span>' : ""}</button>`).join("")}
    </div>`).join("");
}

function go(id) {
  route = id;
  const item = NAV.flatMap(g => g.items).find(i => i[0] === id);
  document.getElementById("crumb").textContent = item ? item[2] : "";
  renderNav();
  document.getElementById("view").innerHTML = VIEWS[id]();
  if (id === "play") mountBoard();
  closeSidebar();
  document.querySelector(".main").scrollTop = 0;
}

// ---------------------------------------------------------------- данные-примеры
const SKILLS = [["Тактика", 72], ["Дебют", 58], ["Эндшпиль", 41], ["Защита", 63], ["Внимательность", 49], ["Расчёт", 66]];
const PLAYERS = [
  ["Женя", 1044, "Разрядник", 31, 3], ["Витя", 978, "Любитель", 54, 2], ["Оля", 921, "Любитель", 22, 1],
  ["Саша", 812, "Любитель", 47, 1], ["Данил", 801, "Любитель", 18, 0], ["Ксюша", 777, "Новичок", 40, 0],
  ["Настя", 742, "Новичок", 12, 0], ["Пашка", 705, "Новичок", 26, 0],
];
const TOURNEYS = [

  const rows = PLAYERS.filter(p => p[0].toLowerCase().includes(q.toLowerCase()));
  if (!rows.length) return `<tr><td colspan="6" class="text-center text-muted-foreground py-8">Никого не нашли по запросу «${q.replace(/[<>&"]/g, "")}»</td></tr>`;
  return rows.map(p => {
    const place = PLAYERS.indexOf(p) + 1, me = p[0] === "Саша";
    return `<tr${me ? ' style="background:hsl(var(--muted) / .6)"' : ""}><td class="num text-muted-foreground">${place}</td><td><div class="flex items-center gap-3"><span class="avatar">${p[0].slice(0, 2).toUpperCase()}</span><span class="font-medium">${p[0]}</span>${me ? '<span class="badge">это вы</span>' : ""}</div></td><td class="text-muted-foreground">${p[2]}</td><td class="text-right num">${p[3]}</td><td class="text-right num">${p[4]}</td><td class="text-right num font-semibold">${p[1]}</td></tr>`;
  }).join("");
}

// ---------------------------------------------------------------- партия (chess.js)
let game, selected = null, hintMove = null, busy = false;
const VAL = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };

function mountBoard() { if (!game) game = new Chess(); selected = null; hintMove = null; drawBoard(); }

function drawBoard() {
  const el = document.getElementById("board");
  if (!el) return;
  const hist = game.history({ verbose: true });
  const last = hist[hist.length - 1];
  const targets = selected ? game.moves({ square: selected, verbose: true }) : [];
  let html = "";
  for (let r = 8; r >= 1; r--) for (let f = 0; f < 8; f++) {
    const sq = "abcdefgh"[f] + r, p = game.get(sq), light = (f + r) % 2 === 1;
    const cls = ["sq", light ? "l" : "d"];
    if (last && (last.from === sq || last.to === sq)) cls.push("last");
    if (selected === sq) cls.push("sel");
    if (hintMove && (hintMove.from === sq || hintMove.to === sq)) cls.push("hint");
    if (p && p.type === "k" && p.color === game.turn() && game.in_check()) cls.push("check");
    const t = targets.find(m => m.to === sq);
    html += `<div class="${cls.join(" ")}" data-sq="${sq}" role="button" aria-label="${sq}">`
      + (p ? `<img alt="" src="data:image/svg+xml;utf8,${encodeURIComponent(PIECES[p.color + p.type.toUpperCase()])}">` : "")
      + (t ? (p ? '<span class="ring"></span>' : '<span class="dot"></span>') : "")
      + (r === 1 ? `<span class="co f">${"abcdefgh"[f]}</span>` : "") + (f === 0 ? `<span class="co r">${r}</span>` : "")
      + "</div>";
  }
  el.innerHTML = html;
  const moves = game.history();
  let rows = "";
  for (let i = 0; i < moves.length; i += 2) rows += `<tr><td class="text-muted-foreground w-10 pl-3 py-1.5">${i / 2 + 1}.</td><td class="py-1.5">${moves[i]}</td><td class="py-1.5">${moves[i + 1] || ""}</td></tr>`;
  document.getElementById("moves").innerHTML = rows || '<tr><td class="p-4 text-muted-foreground">Ходов пока нет. Нажмите на фигуру, затем на клетку.</td></tr>';
  const st = document.getElementById("status"), tb = document.getElementById("turn-badge");
  if (game.game_over()) {
    st.textContent = game.in_checkmate() ? (game.turn() === "w" ? "Мат. Победил соперник" : "Мат! Вы победили") : "Ничья";
    tb.textContent = "партия окончена"; tb.className = "ml-auto badge badge-muted";
  } else {
    st.textContent = game.in_check() ? "Шах!" : (game.turn() === "w" ? "Ваш ход, белые" : "Соперник думает…");
    tb.textContent = game.turn() === "w" ? "ваш ход" : "думает…"; tb.className = "ml-auto badge" + (game.turn() === "w" ? " badge-good" : "");
  }
}

function bestGreedy() {
  const ms = game.moves({ verbose: true });
  let best = [], score = -1;
  for (const m of ms) {
    let s = m.captured ? VAL[m.captured] * 10 - VAL[m.piece] : 0;
    if (m.san.includes("#")) s = 1000; else if (m.san.includes("+")) s += 2;
    if (m.promotion) s += 8;
    if (s > score) { score = s; best = [m]; } else if (s === score) best.push(m);
  }
  return best[Math.floor(Math.random() * best.length)];
}

function aiMove() {
  if (game.game_over() || game.turn() !== "b") return;
  busy = true;
  setTimeout(() => { const m = bestGreedy(); if (m) game.move(m); busy = false; drawBoard(); if (game.game_over()) toast(document.getElementById("status").textContent); }, 450);
}

function onSquare(sq) {
  if (busy || game.game_over() || game.turn() !== "w") return;
  const p = game.get(sq);
  if (selected) {
    const mv = game.moves({ square: selected, verbose: true }).find(m => m.to === sq);
    if (mv) { game.move({ from: selected, to: sq, promotion: "q" }); selected = null; hintMove = null; drawBoard(); aiMove(); return; }
  }
  selected = p && p.color === "w" ? (selected === sq ? null : sq) : null;
  drawBoard();
}

// ---------------------------------------------------------------- общее
function toast(title, desc = "") {
  const t = document.createElement("div");
  t.className = "card toast p-4 shadow-lg";
  t.innerHTML = `<div class="text-sm font-medium">${title}</div>${desc ? `<div class="text-sm text-muted-foreground mt-0.5">${desc}</div>` : ""}`;
  document.getElementById("toasts").appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
function openSidebar() { document.getElementById("sidebar").classList.add("open"); document.getElementById("scrim").hidden = false; }
function closeSidebar() { document.getElementById("sidebar").classList.remove("open"); document.getElementById("scrim").hidden = true; }
function setMode(m) {
  const root = document.documentElement;
  if (m === "system") delete root.dataset.theme; else root.dataset.theme = m;
  try { localStorage.setItem("demo-mode", m); } catch (e) {}
}
function isDark() { const t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function dialog(html) { const d = document.getElementById("dialog"); d.innerHTML = `<div class="dialog-wrap" data-action="close-dialog">${html}</div>`; d.hidden = false; }

function profileDialog() {
  dialog(`<div class="card w-full max-w-md p-6 grid gap-4" role="dialog" aria-labelledby="dlg-t" data-stop>
    <div><h2 id="dlg-t" class="text-lg font-semibold">Новый игрок</h2><p class="text-sm text-muted-foreground">Аккаунт школы работает на любом компьютере.</p></div>
    <label class="grid gap-1.5 text-sm font-medium" for="np-nick">Ник<input class="input font-normal" id="np-nick" placeholder="Например, Маша"></label>
    <label class="grid gap-1.5 text-sm font-medium" for="np-pass">Пароль<input class="input font-normal" id="np-pass" type="password" placeholder="Минимум 6 символов"></label>
    <div class="grid gap-1.5 text-sm font-medium">Кто играет<div class="tabs w-full">${["Ребёнок", "Подросток", "Взрослый"].map((n, i) => `<button class="tab flex-1" aria-selected="${i === 0}" data-age>${n}</button>`).join("")}</div></div>
    <p class="text-sm text-bad" id="np-err" hidden></p>
    <div class="flex justify-end gap-2"><button class="btn btn-outline" data-action="close-dialog">Отмена</button><button class="btn btn-primary" data-action="create-player">Создать аккаунт</button></div>
  </div>`);
  setTimeout(() => document.getElementById("np-nick").focus(), 30);
}

document.addEventListener("click", e => {
  const stop = e.target.closest("[data-stop]");
  const a = e.target.closest("[data-action],[data-nav],[data-sq],[data-mode],[data-accent],[data-board],[data-ptab],[data-age],.tabs .tab");
  if (!a) return;
  if (a.dataset.action === "close-dialog" && stop && a === e.target.closest(".dialog-wrap")) return;
  if (a.dataset.nav) return go(a.dataset.nav);
  if (a.dataset.sq) return onSquare(a.dataset.sq);
  if (a.dataset.mode) { setMode(a.dataset.mode); return go("look"); }
  if (a.dataset.accent) { if (a.dataset.accent === "zinc") delete document.documentElement.dataset.accent; else document.documentElement.dataset.accent = a.dataset.accent; try { localStorage.setItem("demo-accent", a.dataset.accent); } catch (e) {} return toast("Акцент изменён", a.textContent.trim()); }
  if (a.dataset.board) { if (a.dataset.board === "brown") delete document.documentElement.dataset.board; else document.documentElement.dataset.board = a.dataset.board; return; }
  if (a.dataset.ptab) { document.querySelectorAll("[data-ptab]").forEach(t => t.setAttribute("aria-selected", t === a)); document.getElementById("ptab-moves").hidden = a.dataset.ptab !== "moves"; document.getElementById("ptab-board").hidden = a.dataset.ptab !== "board"; return; }
  if (a.matches(".tabs .tab")) { a.parentElement.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t === a)); return; }
  switch (a.dataset.action) {
    case "open-sidebar": return openSidebar();
    case "close-sidebar": return closeSidebar();
    case "toggle-theme": setMode(isDark() ? "light" : "dark"); if (route === "look") go("look"); return;
    case "switch": a.setAttribute("aria-checked", a.getAttribute("aria-checked") !== "true"); return;
    case "join": a.outerHTML = '<span class="badge badge-good">вы записаны</span>'; return toast("Вы записаны", "Пришлём уведомление, когда начнётся первый тур");
    case "search": return toast("Поиск", "В настоящей версии здесь будет командная палитра (Ctrl K)");
    case "hint": if (game && !game.game_over() && game.turn() === "w") { hintMove = bestGreedy(); drawBoard(); toast("Подсказка", "Подсвечен хороший ход"); } return;
    case "undo": if (game && !busy) { game.undo(); if (game.turn() === "b") game.undo(); selected = hintMove = null; drawBoard(); } return;
    case "new-game": game = new Chess(); selected = hintMove = null; drawBoard(); return toast("Новая партия", "Вы играете белыми");
    case "resign": if (game && !game.game_over()) { game = new Chess(); drawBoard(); toast("Вы сдались", "Начата новая партия. В рейтинг не пошло — это демо"); } return;
    case "profile-dialog": return profileDialog();
    case "close-dialog": document.getElementById("dialog").hidden = true; return;
    case "create-player": {
      const n = document.getElementById("np-nick").value.trim(), p = document.getElementById("np-pass").value, err = document.getElementById("np-err");
      if (n.length < 2) { err.textContent = "Ник — минимум 2 символа."; err.hidden = false; return; }
      if (p.length < 6) { err.textContent = "Пароль — минимум 6 символов."; err.hidden = false; return; }
      document.getElementById("dialog").hidden = true; return toast("Аккаунт создан", `${n.replace(/[<>&"]/g, "")} — демо, на сервер ничего не ушло`);
    }
  }
});
document.addEventListener("input", e => { if (e.target.id === "player-search") document.getElementById("players-body").innerHTML = playersRows(e.target.value); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { document.getElementById("dialog").hidden = true; closeSidebar(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); toast("Поиск", "В настоящей версии здесь будет командная палитра"); }
});

try { const m = localStorage.getItem("demo-mode"); if (m && m !== "system") document.documentElement.dataset.theme = m; const ac = localStorage.getItem("demo-accent"); if (ac && ac !== "zinc") document.documentElement.dataset.accent = ac; } catch (e) {}
const start = (location.hash || "").slice(1);
go(VIEWS[start] ? start : "home");
</script>
